<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="B. French">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7ede5">
<title>Bradley French Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400..700&family=League+Gothic&family=Anton&family=Figtree:wght@400..900&family=Archivo:wght@400;500;600&family=Big+Shoulders+Display:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: a drawing-sheet frame. Thin rules, a title block header, image-first grid; one orange mark carried over from the resume. */
:root{
  --paper:#f4f3ef; --panel:#ffffff; --ink:#202421; --muted:#59625c; --rule:#cfd2cc; --accent:#f47b20;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
header.top{border-bottom:1px solid var(--ink);position:sticky;top:0;background:var(--paper);z-index:5}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent);flex:none}
.brand b{font-family:var(--body);font-weight:600;font-size:17px;letter-spacing:0;line-height:1}
.bf{width:44px;height:44px;border-radius:50%;background:var(--accent);border:2px solid var(--ink);box-shadow:0 0 0 3px var(--paper);color:#fff;font-family:var(--body);font-weight:600;font-size:17px;letter-spacing:.02em;display:grid;place-items:center;line-height:1;flex:none}
.rail.top::before{top:-90px}
.rail.top{padding-top:clamp(28px,4vw,52px)}
.pg{padding-top:0!important}
.rl:empty::after{display:none}
.home .rs:nth-child(2) .rl::after,.home .rs:nth-child(3) .rl::after{display:none}
.o{color:var(--accent)}
.rc h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(44px,7vw,92px);line-height:.95;margin:0}
.rc h1{font-size:clamp(40px,6.4vw,92px);margin-bottom:18px}
.rail .filters{border:0;padding:0}
.rail .stats{margin-top:16px}
.stats b{color:var(--accent)!important}
.home{margin-bottom:6px}
.home .rs:last-child{padding-bottom:10px}
.grid{padding-top:18px!important}
@media (min-width:701px){.brand{margin-left:150px}}
.brand .bf{position:relative}
.brand .bf::after{content:"";position:absolute;left:50%;top:100%;margin:5px 0 0 -1.5px;width:3px;height:22px;background:var(--ink)}
@media (max-width:700px){.rail.top::before{top:0}}
.rail{--lw:150px;position:relative;margin-top:8px}
:root{--pad:clamp(16px,4vw,48px);--lx:172px}
main{position:relative}
main::before{content:"";position:absolute;left:calc(var(--pad) + var(--lx) - 1.5px);top:0;bottom:0;width:3px;background:var(--ink)}
.rail::before{display:none}
.rs{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);column-gap:44px;padding:0 0 30px}
.rs:first-child{padding-top:6px}
.rl{text-align:right;font-size:17px;line-height:1.25;text-transform:lowercase;position:relative}
.rl::after{content:"";position:absolute;right:-30px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--ink);box-sizing:border-box;box-shadow:0 0 0 3px var(--paper)}
.rc{min-width:0;font-size:16px}
.jb .rl{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:5px}
.jb .rl::after{width:11px;height:11px;right:-27.5px;top:8px;background:var(--paper);border:2.5px solid var(--accent)}
.jb .jh b{font-size:19px}
.jb{padding-bottom:26px}
.rc ul li::before{display:none}
.rc ul li{padding-left:16px}
.rc ul li::after{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
@media (max-width:700px){.jb .rl::after{right:auto;left:-27.5px;top:8px}}
.rc p{max-width:65ch;margin:0 0 12px}
.rc p:last-child{margin-bottom:0}
.rc .lead{font-size:18px}
.rc ul{margin:8px 0 0;padding:0;list-style:none;max-width:65ch}
.rc ul li{position:relative;margin:5px 0;font-size:15px}
.rc ul li::before{content:"";position:absolute;left:-26.5px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.rc .jh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:17px}
.rc .jh span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rc i{color:var(--muted)}
.rc a{text-decoration-color:var(--accent);text-underline-offset:3px}
@media (max-width:700px){.rail{--lw:0px}:root{--lx:22px}.rs{grid-template-columns:1fr;padding-left:44px}.rl{text-align:left;font-weight:600;margin-bottom:6px}.rl::after{right:auto;left:-30px}.rc ul li::before{left:-28.5px}}
nav{display:flex;gap:clamp(12px,2vw,22px);flex-wrap:wrap}
nav a{text-decoration:none;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 0;border-bottom:2px solid transparent}
nav a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.intro{padding:clamp(28px,5vw,64px) 0 clamp(20px,3vw,36px);display:grid;gap:18px}
h1{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(44px,8vw,104px);line-height:.92;letter-spacing:.01em;margin:0;text-wrap:balance}
.lede{max-width:62ch;color:var(--muted);font-size:18px;margin:0}
.stats{display:flex;gap:28px;flex-wrap:wrap;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.chip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;letter-spacing:.04em}
.filters.f2{border-top:0}
.chip span{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--ink)}
.chip[aria-pressed="true"] span{color:#fff;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:clamp(16px,2vw,28px);padding:28px 0 72px}
.card{text-decoration:none;display:grid;gap:10px;align-content:start}
.card .ph{aspect-ratio:4/3;background:var(--panel);overflow:hidden;border:1px solid var(--rule)}
.card .ph{position:relative}
.ax{display:inline-flex;align-items:center;flex-wrap:wrap}
.aw.an{left:auto;right:0;background:var(--ink)}
.aw{position:absolute;left:0;bottom:0;z-index:1;background:var(--accent);color:#fff;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;font-weight:600}
.card .th{width:100%;height:100%;background-size:600% 400%;image-rendering:auto;background-repeat:no-repeat;transition:transform .5s ease}
.card:hover .th{transform:scale(1.04)}
.card:hover h3{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.pn a:hover{color:var(--accent)}
.back:hover{color:var(--accent)}
.card h3{min-height:2.1em;font-family:var(--display);font-weight:600;font-size:24px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;margin:0}
.meta{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* project */
.proj{padding:28px 0 40px}
.back{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.proj h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(38px,6vw,80px);line-height:.95;margin:14px 0 6px;text-wrap:balance}
.hero{margin:22px 0;border:1px solid var(--rule);background:var(--panel)}
.hero img{width:100%;aspect-ratio:16/9;object-fit:cover;cursor:zoom-in}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,360px);gap:clamp(20px,4vw,56px);align-items:start}
.cols p{max-width:65ch;font-size:18px;margin:0 0 14px}
dl{margin:0;border-top:1px solid var(--rule)}
dl div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
dt{color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-size:11px;padding-top:3px}
dd{margin:0}
.award{display:inline-flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--accent);padding:5px 10px;margin-top:6px}
.gal{margin-top:8px!important;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2vw,24px);margin-top:36px}
.gal button{padding:0;border:1px solid var(--rule);background:var(--panel)}
.gal img{width:100%;height:100%;aspect-ratio:16/10;object-fit:cover}
.gal img.whole{object-fit:contain;background:#fff}
.gal button:last-child:nth-child(odd){grid-column:1/-1}
.gal button:last-child:nth-child(odd) img{aspect-ratio:21/9}
@media (max-width:700px){.gal{grid-template-columns:1fr}.gal button:last-child:nth-child(odd) img{aspect-ratio:16/10}}
.pn{display:flex;justify-content:space-between;gap:16px;margin-top:44px;padding-top:18px;border-top:1px solid var(--rule);flex-wrap:wrap}
.pn a{text-decoration:none;font-family:var(--display);font-weight:600;font-size:22px;text-transform:uppercase}
.pn small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.14em;color:var(--muted)}
.cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:-12px 0 20px}
.tb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:2px solid var(--ink);margin-top:14px}
.tb div{padding:8px 12px;border-left:1px solid var(--ink);font-size:14px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.tb div:first-child{border-left:0;font-variant-numeric:tabular-nums}
.tb small{display:block;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:400}
.cols h4{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:600}
.cols p.det{font-size:16px;color:var(--muted)}
.card .meta{display:flex;justify-content:space-between;gap:12px;white-space:nowrap;font-size:12px;letter-spacing:.07em;padding-top:2px}
.card .meta span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .meta span:last-child{font-variant-numeric:tabular-nums}
.meta b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:620px){.tb{grid-template-columns:1fr 1fr}.tb div:nth-child(3){border-left:0}.tb div:nth-child(n+3){border-top:1px solid var(--ink)}}

/* sector group headers + drawing index */
.groups{margin-top:0}
.sg{margin-top:22px;padding-bottom:6px}
.sg .rc{border-top:3px solid var(--ink);padding-top:14px}
.sg .rl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:24px;font-variant-numeric:tabular-nums}
.sg .rl::after{content:attr(data-k);width:32px;height:32px;right:-38px;top:16px;background:var(--paper);color:var(--accent);font-size:14px;font-weight:600;letter-spacing:0;display:grid;place-items:center;line-height:1}
.shh{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(26px,3vw,38px)!important;line-height:1!important;margin:0 0 4px!important}
.sg .grid{padding-bottom:18px}
.proj.rail{padding-top:28px}
.proj .rs{padding-bottom:22px}
@media (max-width:700px){.sg .rl{padding-top:0;margin-bottom:10px}.sg .rl::after{right:auto;left:-38px;top:-8px}.sg .rc{border-top:0;padding-top:0}}
[data-tp="grid"] .sg .rl::after{background:var(--accent);color:#fff}
[data-tp="grid"] .sg .rc{border-top-style:dashed;border-top-width:2px}
[data-tp="poster"] .sg .rc{border-top:6px solid var(--accent)}
[data-tp="poster"] .sg .rl::after{background:var(--accent);border-color:var(--accent);color:#fff}
[data-tp="poster"] .home{position:relative}
[data-tp="poster"] .home::before{content:"";display:block;position:absolute;left:calc(var(--lx) - 1.5px);top:0;bottom:0;width:3px;background:#161412}
.sh{display:flex;align-items:center;gap:14px;border-top:3px solid var(--ink);padding:14px 0 0;margin-top:34px}
.sh h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(26px,3vw,38px);line-height:1;margin:0;flex:1}
.gb{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--accent);flex:none}
.ct{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.sh+.grid{padding-bottom:10px}
.ixl{padding:10px 0 6px}
.ix{display:grid;grid-template-columns:64px minmax(0,2.2fr) minmax(0,1.3fr) minmax(0,1fr) 48px;gap:16px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule);text-decoration:none;font-size:14px;color:var(--muted)}
.ix b{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;letter-spacing:.08em}
.ix .it{font-family:var(--display);font-weight:600;font-size:22px;text-transform:uppercase;color:var(--ink);line-height:1.05}
.ix span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.ix:hover .it{color:var(--accent)}
@media (max-width:760px){.ix{grid-template-columns:52px minmax(0,1fr) 44px}.ix .if,.ix .il{display:none}}
main{padding-bottom:70px}
.tbf{display:none}
.tps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;text-transform:none;letter-spacing:0}
.tps span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-right:6px}
.tps .chip{font-size:12px;padding:5px 12px;color:var(--ink)}
/* THEME: Gridline */
[data-tp="grid"] main::before,[data-tp="sheet"] main::before{background:repeating-linear-gradient(to bottom,var(--ink) 0 18px,transparent 18px 23px,var(--ink) 23px 26px,transparent 26px 31px)}
[data-tp="grid"] .rail{counter-reset:g}
[data-tp="grid"] .rs:not(.jb):not(.sg) .rl:not(:empty)::after{counter-increment:g;content:counter(g,upper-alpha);width:26px;height:26px;right:-35px;top:-2px;background:var(--paper);border:2px solid var(--ink);color:var(--accent);font-size:12px;box-shadow:0 0 0 3px var(--paper);font-weight:600;display:grid;place-items:center;line-height:1}
[data-tp="grid"] .home .rs:nth-child(2) .rl::after,[data-tp="grid"] .home .rs:nth-child(3) .rl::after{display:grid}
[data-tp="grid"] .jb .rl::after{border-radius:0;transform:rotate(45deg)}
[data-tp="grid"] .gb{background:var(--accent);color:#fff}
[data-tp="grid"] .sh{border-top-style:dashed}
[data-tp="grid"] .card .ph{border-color:var(--ink)}
@media (max-width:700px){[data-tp="grid"] .rs:not(.jb):not(.sg) .rl:not(:empty)::after{right:auto;left:-35px}}
/* THEME: Sheet */
[data-tp="sheet"] body{background-image:linear-gradient(color-mix(in srgb,var(--rule) 38%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--rule) 38%,transparent) 1px,transparent 1px);background-size:56px 56px}
[data-tp="sheet"] body::before{content:"";position:fixed;inset:8px;border:2px solid var(--ink);outline:1px solid var(--rule);outline-offset:-5px;pointer-events:none;z-index:9}
[data-tp="sheet"] header.top{top:9px;margin:0 9px}
[data-tp="sheet"] .tbf{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1.4fr;border:2px solid var(--ink);margin-top:18px;color:var(--ink);text-transform:none;letter-spacing:0;font-size:14px;font-weight:500}
[data-tp="sheet"] .tbf div{padding:8px 12px;border-left:1px solid var(--ink)}
[data-tp="sheet"] .tbf div:first-child{border-left:0}
[data-tp="sheet"] .tbf small{display:block;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:400}
[data-tp="sheet"] .card .ph,[data-tp="sheet"] .hero,[data-tp="sheet"] .gal button{border-color:var(--ink);outline:1px solid var(--rule);outline-offset:4px}
[data-tp="sheet"] .card .meta b{font-size:13px;border:1px solid var(--accent);padding:1px 5px}
[data-tp="sheet"] .rc,[data-tp="sheet"] .rl,[data-tp="sheet"] .sh{background:var(--paper)}
[data-tp="sheet"] .sh{border-top-width:2px}
@media (max-width:700px){[data-tp="sheet"] .tbf{grid-template-columns:1fr 1fr}[data-tp="sheet"] .tbf div{border-left:0;border-top:1px solid var(--ink)}}
/* THEME: Poster */
[data-tp="poster"] .home,[data-tp="poster"] .pg .rs:first-child{--ink:#161412;--muted:#4a2c12;--paper:#f47b20;--rule:rgba(0,0,0,.4);--accent:#161412;color:#161412}
[data-tp="poster"] .home{background:#f47b20;box-shadow:0 0 0 100vmax #f47b20;clip-path:inset(0 -100vmax);padding-bottom:26px;margin-bottom:10px}
[data-tp="poster"] .home .o,[data-tp="poster"] .pg .rs:first-child .o{color:#fff}
[data-tp="poster"] .home .rc h1{font-size:clamp(48px,8.4vw,128px);line-height:.88}
[data-tp="poster"] .home .lede{color:#2a1a0c}
[data-tp="poster"] .home .chip[aria-pressed="true"]{background:#161412;color:#fff}
[data-tp="poster"] .pg .rs:first-child{background:#f47b20;box-shadow:0 0 0 100vmax #f47b20;clip-path:inset(0 -100vmax);padding:26px 0 30px;margin-bottom:30px}
[data-tp="poster"] .pg .rail.top{padding-top:0}
[data-tp="poster"] .pg .rs:first-child h2{font-size:clamp(56px,10vw,140px)}
[data-tp="poster"] .sh{border-top:6px solid var(--accent)}
[data-tp="poster"] .gb{background:var(--accent);border-color:var(--accent);color:#fff}
[data-tp="poster"] .card .meta b{background:var(--accent);color:#fff;padding:1px 6px}
[data-tp="poster"] .card:hover .ph{outline:4px solid var(--accent)}
[data-tp="poster"] .proj h2{border-left:10px solid var(--accent);padding-left:16px}
[data-tp="poster"] header.top{border-bottom-color:#161412}
/* about */
.pg{padding:40px 0 80px}
.pg>h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(44px,7vw,92px);line-height:.95;margin:0 0 28px;padding-bottom:18px;border-bottom:1px solid var(--ink)}
.big{font-size:clamp(20px,2.2vw,26px);line-height:1.4;max-width:34ch!important}
.xp.tight li{padding:7px 0;grid-template-columns:52px 1fr}
.xp.tight time{color:var(--accent);font-weight:600}
.job{padding:18px 0;border-top:1px solid var(--rule)}
.jh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:18px}
.jh span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.jr{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 0 8px}
.job ul{margin:8px 0 0;padding-left:18px;max-width:65ch}
.job li{margin:4px 0;font-size:15px}
.tb.ct{grid-template-columns:1fr 1fr;max-width:640px;margin-top:-1px}
.tb.ct:first-of-type{margin-top:22px}
@media (max-width:620px){.tb.ct{grid-template-columns:1fr}.tb.ct div{border-left:0}.tb.ct div+div{border-top:1px solid var(--ink)}}
.about{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(24px,5vw,72px)}
.about h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(34px,5vw,60px);line-height:1;margin:0 0 16px}
.about h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:28px 0 8px;font-weight:600}
.about p{max-width:62ch;margin:0 0 14px}
.xp{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}

["ld-detroitsuperior", "Detroit-Superior Lofts", "Cleveland, OH", "N", "L", "2007", 3, "Design from schematic design through construction; all renderings and presentation drawings", "A proposal for TEG Properties at Detroit Avenue and West 28th Street in Cleveland: seven stories with more than 50 loft condominiums and two-story townhomes. The corner is a curve of glass, and balconies run along both street fronts. Brick covers the lower floors and lighter panels the top."],
["ld-goldenview", "Goldenview Townhomes", "Cincinnati, OH", "N", "L", "2003", 2, "Design from schematic design through construction; all renderings and presentation drawings", "Twenty-four townhomes step down a hillside at Golden and Delta avenues in Cincinnati's Mt. Lookout. Garages sit at grade, and the living floors above open onto decks that face the valley."],
["ld-pineridge", "Pine Ridge", "", "N", "L", "2003", 4, "Design from schematic design through construction; all renderings and presentation drawings", "A three-story residential building with garages at grade. The garage wings step forward under their own gables to form an entry court, and the brick on the lower two floors was studied in red and in brown."],
["bf-inventors", "The Inventors Collection", "Chicago, IL", "N", "", "2007", 5, "Exterior and interior renderings and the presentation boards, for Pershing Group with Sargent Architects", "Single-family and multifamily homes priced for moderate-income buyers on Chicago's South Side, on the blocks between Princeton, Harvard and Stewart avenues. Each model is named for an African American inventor of a household product: the Burr, the Parker and the Latimer. The brick fronts share one gabled profile and change at the porch, the bay and the stone trim. Homes from the collection were built."],
["x-environs", "Four Infill Houses", "Chicago, IL", "P", "", "2006", 5, "3D visualization and presentations", "Four single-family houses for standard Chicago lots on Honore, Wolcott, Magnolia and Wayne. Each front is brick with limestone at the base, the window surrounds and the cornice, and a raised stoop to one side."],
["ld-mccloud", "McCloud Residence", "", "P", "L", "2003", 5, "Design from schematic design through construction; all renderings and presentation drawings", "A house on a wooded, sloping lot. The entry side is a story and a half under one long roof. The rear drops a full level to a stone terrace, with stacked porches and a two-story window wall between stone chimneys."],
["ld-kenilworth", "Kenilworth Residence", "", "P", "L", "2003", 4, "Design from schematic design through construction; all renderings and presentation drawings", "A brick and stone house under a shingled roof with eyebrow dormers. Copper-colored hipped roofs cap the two corner bays, and a curved window wall faces the rear lawn."],
["ld-chester", "Chester Residence", "", "P", "L", "2002", 2, "Design from schematic design through construction; all renderings and presentation drawings", "A new house in a Victorian manner. A porch wraps the front corner beneath a turret with a conical roof, and a two-story bay of windows lights the side."],
["ld-zaremba", "Zaremba Residence Playroom", "", "P", "L", "2003", 2, "Design from schematic design through construction; all renderings and presentation drawings", "An attic playroom for a family's children. The sloped ceiling carries cut-out cloud shapes lit from behind, storage cabinets line both knee walls, and a custom round rug marks the table at the center of the floor."],
["ld-beachwood", "Beachwood Community Center", "Beachwood, OH", "C", "L", "2006", 6, "Design from schematic design through construction; all renderings and presentation drawings", "A 14,500 SF community center connected to Beachwood's city hall, built by Panzica Construction. A curved roof marks the entry between a glass-walled wing and a two-story block faced in wood-toned panels. Inside, the main hall rises 30 feet, with a gallery wall for local artists, six program rooms and three courtyards."],
["ld-temple", "The Temple-Tifereth Israel", "Beachwood, OH", "R", "L", "2003", 2, "Design from schematic design through construction; all renderings and presentation drawings", "An addition for the congregation's Beachwood campus, in white stucco and orange brick. A glazed upper room sits under a deep flat roof, and low planter walls step the lawn down to a paved court."],
["ld-nch", "NCH Shopping Center", "", "I", "L", "2003", 3, "Design from schematic design through construction; all renderings and presentation drawings", "A single-story retail strip. Brick gable pavilions with arched entries and round windows mark the center and the ends, and a continuous white canopy shades the storefronts between."],
["wha-finley", "3333 Finley", "Downers Grove, IL", "W", "W", "2016", 5, "3D visualization, presentations and drawings", "Repositioning of Finley Point, a 224,000 SF office tower built in 1998, after its single tenant downsized. The amenity floor adds a lounge with a fireplace wall, a cafe counter under a patterned ceiling, a training room and a terrace with umbrellas beside the pond. Leasing afterward took occupancy from 39 percent to almost 90."],
["wha-kens", "1220 Kensington", "Oak Brook, IL", "W", "W", "2017", 5, "3D visualization, presentations and drawings", "A 1970s office building bought by Lizzadro Properties in 2015 and redeveloped with the Lizzadro Museum of Lapidary Art on the ground floor and offices above. A new two-story glass entry and a sign wall face the drop-off, and the parking is reorganized around the building."],
["wha-125w", "125 South Wacker", "Chicago, IL", "W", "W", "2017", 4, "3D visualization, presentations and drawings", "Studies for a new street entry on Wacker Drive. Each option sets a white canopy and glass vestibule against the dark stone base of the tower."],
["wha-225w", "225 West Wacker", "Chicago, IL", "W", "W", "2017", 4, "3D visualization, presentations and drawings", "A new storefront at the corner of the tower base, shown by day and at dusk. Tall glass opens the lobby to the sidewalk, with planters along the balustrade."],
["wha-33d", "33 North Dearborn", "Chicago, IL", "W", "W", "2015", 4, "3D visualization, presentations and drawings", "Four options for a typical elevator lobby. Each ends the corridor with a different focal wall: a metal screen, back-lit glass, wood paneling or artwork."],
["wha-10120", "10 and 120 South Riverside", "Chicago, IL", "W", "W", "2014", 3, "3D visualization, presentations and drawings", "Elevator lobby options for the two Riverside Plaza buildings. Dark wood or white panels line the walls, with a looped light fixture overhead and patterned carpet underfoot."],
["wha-ajg", "Arthur J. Gallagher & Co. Global Headquarters", "Rolling Meadows, IL", "W", "W", "2014", 3, "3D visualization, presentations and drawings", "Gut renovation of a 315,000 SF building at 2850 Golf Road for the company's global headquarters. The exterior studies replace the old facade with blue glass and vertical fins and set the name at the roofline. The program added a new front entrance, dining, a fitness club, a cafe and a rooftop terrace."],
["wha-tri", "Tri-State International Office Center", "Lincolnshire, IL", "W", "W", "2014", 3, "3D visualization, presentations and drawings", "Five office buildings totaling 559,204 SF at the Tri-State Tollway and Half Day Road, renovated in 2014 with Trammell Crow Company as developer. The views show the campus from the tollway and from across its pond."],
["wha-wat", "River North Park Apartments", "Chicago, IL", "N", "W", "2016", 6, "3D visualization, presentations and drawings", "Studies for the repositioning of River North Park, a 24-story tower of 400 apartments at 320 West Illinois, built in 1986 and operated by Waterton. New storefronts and canopies line the street beside the elevated tracks, and the roof of the low base becomes a landscaped deck for residents."],
["wha-janko", "Conway Park Hotel Studies", "Lake Forest, IL", "L", "W", "2016", 6, "3D visualization, presentations and drawings", "Facade studies for a five-story hotel on Janko Group's 9.7-acre site at 200 North Field Drive in Conway Park. The options test brick, metal panel and glass on the same massing, some drawn as sketches over the model."],
["wha-napa", "Walnut Grove", "Napa Valley, CA", "L", "W", "2017", 3, "3D visualization, presentations and drawings", "Site studies for a hospitality project in Napa Valley. Four gabled buildings frame a central court, with hedgerows and orchard rows around the edge."],
["wha-ap35", "Abbott Park AP35", "Abbott Park, IL", "W", "W", "2013", 3, "3D visualization, presentations and drawings", "Exterior views of a four-story office campus across its lawn."],
["wha-alpc", "1100 Superior Lobby", "Cleveland, OH", "W", "W", "2016", 2, "3D visualization, presentations and drawings", "Two options for an office lobby. Stone-clad columns, a long reception desk and a seating group on a bright rug sit in front of the glass wall."],
["wha-abb", "AbbVie North Chicago", "North Chicago, IL", "W", "W", "2016", 2, "3D visualization, presentations and drawings", "Master plan study for the North Chicago campus. Older buildings give way to a central green, with new buildings and parking at its edges."],
["wha-cta", "CEDA Offices, 567 West Lake", "Chicago, IL", "W", "W", "2014", 3, "3D visualization, presentations and drawings", "Workplace interiors: open office under exposed concrete beams, a break room with green accents and an elevator lobby with a patterned blue wall."],
["wha-tta", "Two TransAm Plaza", "Oakbrook Terrace, IL", "W", "W", "2015", 2, "3D visualization, presentations and drawings", "Atrium lounge and elevator lobby for a five-story, 118,000 SF office building, part of a renovation of the main lobby, atrium and restrooms."],
["wha-ohare", "O'Hare Plaza Common Areas", "", "W", "W", "2014", 3, "3D visualization, presentations and drawings", "Common areas for an office building near O'Hare: reception with a chevron floor, a cafe and a tenant lounge."],
["wha-123w", "123 North Wacker Roof Deck Study", "Chicago, IL", "W", "W", "2016", 2, "3D visualization, presentations and drawings", "Study for a tenant roof deck on the 30-story tower, for LaSalle Investment Management. A trellis shades lounge seating and planters in a setback of the building, with the river towers beyond. The amenity was later built indoors as a 30th-floor tenant lounge."],
["wha-231", "231 South LaSalle", "Chicago, IL", "W", "W", "2013", 3, "3D visualization, presentations and drawings", "An amenities center for a historic bank building, with a fitness center, a tenant lounge and a roof deck. The lounge sets a fireplace wall under globe pendants."],
["wha-zur", "Zurich North America Headquarters Competition", "Schaumburg, IL", "W", "W", "2013", 3, "3D visualization, presentations and drawings", "Elevation renderings for the headquarters competition entry."],
["wha-pfz3", "Pfizer H3 Master Plan", "", "W", "W", "2017", 5, "3D visualization, presentations and drawings", "Break areas and cafes for a workplace master plan. Faceted white walls fold around the pantries, with teal alcoves for seating."],
["wha-cp1", "Abbott CP1 Coffee Bar", "", "W", "W", "2013", 3, "3D visualization, presentations and drawings", "Three options for a lobby coffee bar."],
["sg-burrell", "Burrell Group Offices", "", "W", "S", "2017", 5, "3D visualization and presentations", "Office suite with glass-fronted rooms around an open center. Black frames, white walls and a dark ceiling run through the conference room and private offices."],
["sg-cohen", "Cohen Residence", "", "P", "S", "2016", 5, "3D visualization and presentations", "Massing and material studies for a house addition. Dark-framed gables and a glazed rear room extend the white house under a blue metal roof."],
["bf-octavio", "Octavio Cantina & Kitchen", "Chicago, IL", "L", "", "2017", 5, "Renderings", "A restaurant at 5310 North Clark in Andersonville, under a skylit ceiling. Banquettes with slatted backs divide the room, and a patterned screen marks the entry."],
["mca-conc", "Evanston Concession Building", "Evanston, IL", "L", "C", "2017", 2, "Renderings", "Concession interior with a coffered ceiling, a white counter and blue tile behind the service line."],
["m2-lewis", "Lewis Memorial Assisted Living", "", "H", "D", "2018", 6, "3D visualization, presentations and drawings", "Assisted living residence with gabled wings around shared courts, photographed during construction. The boards show the site plan, the floor plan and the typical one- and two-bedroom units."],
["m2-boiler", "Boilermakers Office", "", "W", "D", "2018", 4, "3D visualization, presentations and drawings", "Office renovation with a curved reception desk under a slatted ceiling. Black-framed sliding glass fronts the conference room and private offices, and an existing arched window lights the corner office."],
["m2-vandiver", "Vandiver Kitchen", "", "P", "D", "2020", 3, "3D visualization, presentations and drawings", "Kitchen remodel that opens the kitchen to the living room. A waterfall island faces walnut cabinets and a green tile backsplash."],
["m2-kait", "Kaitlyn's Cottage", "Defiance, OH", "H", "D", "2012", 3, "3D visualization and presentations", "A 4,500 SF respite home on the ProMedica Defiance Regional Hospital campus for teens and adults with disabilities, with four private bedrooms and shared dining and activity rooms. Stone chimneys stand at both gables, with a long porch between them."],
["m2-wood", "Ron Wood Residence", "", "P", "D", "2016", 5, "3D visualization, presentations and drawings", "A three-story house built on a steep infill lot. White and gray volumes step back from the street behind a red fin wall, with the garage at grade and balconies above. Inside, the red wall carries through the main floor as a single plane that ties the living room, kitchen and open steel stair together. The photographs show the completed house; the renderings and massing studies that led to it follow."],
["m2-waymire", "Waymire Residence", "", "P", "D", "2017", 4, "3D visualization, presentations and drawings", "Two houses on one sloping lot, studied in massing models. Each has a red stair tower, gray panels and balconies facing the street."],
["m2-gallatin", "1411 Gallatin Avenue", "Nashville, TN", "I", "D", "2018", 4, "3D visualization, presentations and drawings", "A two-story retail building on Gallatin Avenue. Gray metal panels in three tones wrap the upper floor inside a green frame, shown in the design model and in construction."],
["kg-sted", "Saint Edward Elevator Addition", "Chicago, IL", "R", "K", "2019", 2, "Renderings, presentations and marketing material for the project designer", "An elevator addition at the side of the church. The new brick tower matches the banding of the nave wall and gives a covered, level entry."],
["kg-giles", "St. Giles Elevator Study", "", "R", "K", "2018", 3, "Renderings, presentations and marketing material for the project designer", "Study for an elevator addition, set into photographs of the existing building. The tower rises beside the side entry in matching brick."],
["kg-ascg", "All Saints Cremation Garden", "Des Plaines, IL", "R", "K", "2017", 6, "Renderings, presentations and marketing material for the project designer", "The first cremation garden in the Archdiocese of Chicago, opened in summer 2017 beside the Immaculate Heart of Mary Mausoleum at All Saints Cemetery. Curving paths cross a pond and planted beds between niche walls, pergolas and a round pavilion."],
["bf-drone", "Aerial Photography", "Chicago, IL", "A", "", "2018", 8, "FAA Part 107 pilot: aerial photography, video and editing", "Drone photography of Chicago buildings and the skyline, flown and edited under an FAA Part 107 license."],
["bf-elixir", "Elixir Andersonville", "Chicago, IL", "L", "", "2015", 5, "Designer: full design of the project", "A cocktail lounge of about 1,000 SF at 1509 West Balmoral in Andersonville, opened in September 2015 beside Replay. The bar runs the length of the room under a dark canopy, with back-lit shelves of bottles behind it and high-top tables along the wall."],
["bf-meat", "Meat", "Chicago, IL", "L", "", "2013", 6, "Designer: full design of the project", "A restaurant and bar at 3339 North Halsted, opened in December 2013. Exposed timber joists run over a long bar and tufted leather booths, a private table sits against a wall of reclaimed metal panels, and the name is painted on the brick."],
["grec-ace", "Ace Hotel Downtown Los Angeles", "Los Angeles, CA", "L", "G", "2012", 6, "Developed and coordinated the construction drawings", "Conversion of the 1927 United Artists Theatre building on Broadway into a 182-room hotel, with the 1,600-seat movie palace kept as a performance venue. The construction set covers demolition, the new guest floors in the tower, a rooftop pool bar and the restored street front. GREC was design architect, with Commune for interiors and Killefer Flammang as executive architect. The hotel opened in 2014.", "2014 Los Angeles Architectural Awards, Hospitality; 2014 Los Angeles Conservancy Preservation Award"],
["bf-lovestreet", "Love Street", "Chicago, IL", "L", "", "2019", 5, "Designer: full design of the project and all 3D visualization", "A bar interior in black with pink stools. The back bar is a pair of arched wood cases around a mirror, beaded chandeliers hang from a pressed-tin ceiling, and a pink cove light rings the lounge."],
["bf-tomi", "Tomi", "Chicago, IL", "L", "", "2018", 4, "Designer: full design of the project and all 3D visualization", "A food hall stall. A skyline cut from white panels rises behind the counter with the name in gold, over a pale wood front and black tile. The street-side views set the stall into photographs of the hall."],
["bf-seven", "Seven", "Chicago, IL", "L", "", "2015", 2, "Designer: full design of the project and all 3D visualization", "A nightclub in a brick shell. A long white bar glows red at its base under a wall of framed portraits, and a raised platform with lit glass panels faces the dance floor."],
["bf-phoebes", "Phoebe's Cupcakes", "Chicago, IL", "L", "", "2012", 3, "Designer: full design of the project and all 3D visualization", "A cupcake shop. Curved glass cases front the counter under white dome pendants, with blue patterned tile behind and open shelving along the side wall. The millwork was modeled piece by piece for the builder."],
["grec-1440", "1440 West Washington Aerial Views", "Chicago, IL", "A", "G", "2023", 5, "FAA Part 107 pilot: aerial photography", "Drone photography over 1440 West Washington in Chicago's West Loop for GREC, flown at midday, sunset and dusk to record the skyline views from the site."],
["bf-stu", "Racine Avenue Townhouse", "Chicago, IL", "P", "B", "2017", 6, "Exterior design and all renderings", "A private three-story townhouse on Racine Avenue in Chicago, given a new exterior for the couple who live there. A new front of light panels and dark brick replaces the original gabled facade, with a three-story window wall bringing daylight deep into each floor. A steel stair and a wood-lined canopy mark the entry, and the outdoor space is fitted out as a room of its own with a wood deck, planters and a dining area. Architect of record: Mohr Architecture."],

  ${sec("profile",`<p class="lead">Good buildings start with the people inside them: patients, students, staff and the public. For twenty years I have designed places for care, learning and work, led them from first concept through construction, and shown clients what those places will be before they are built.</p><p>Most recently I was Project Designer at A2H, working on a micro hospital, MRI suites, ambulatory surgery centers, K-12 schools and civic buildings. Before that I spent six years at Wright Heerema Architects in Chicago repositioning office buildings and designing corporate interiors, and earlier worked on hotels, an office tower, master plans and cemetery buildings.</p><p>I also build software for architecture firms through Cube &amp; Curve.</p>`)}

  ${sec("documentation",`<p>I produce drawing sets in Revit from schematic design through construction documents, and I stay with the project through construction administration. That means coordinating with the engineering disciplines and keeping plans, schedules and details in agreement as the design changes.</p><p>I draw what I design, so the intent holds up when it is built.</p>`)}
  ${sec("visualization",`<p>I make the renderings, animations and presentation boards that help clients, school boards and cities see a project and decide. I have produced the 3D and presentation work at every firm I have worked for, from early massing studies and facade options to final marketing images.</p><p>I also shoot aerial video and photography as an FAA Part 107 commercial drone pilot.</p>`)}
  ${sec("tools",`<p>Through Cube &amp; Curve I build software for architecture, engineering and construction firms with one goal: to make the firm more efficient by using AI appropriately. It goes to work on the searching, sorting and tracking that nobody can bill for.</p><p><b>Project Dashboard.</b> A project folder can hold thousands of files, filed by many hands over many years. Project Dashboard reads that folder as it is and lays the whole job out graphically on one screen: drawings, sets, specifications, RFIs, ASIs, change orders and submittals. It finds the current set for every discipline and assembles it as one PDF. Closeout sets and record drawings from past jobs come up without tracking down the person who ran them. Nothing is moved or renamed.</p><p><b>Command Center.</b> The one place to see how the firm is running: where every project stands, who is on each team and how the hours are forecast eight weeks out, so a project manager sees who is overbooked before it becomes a problem. Timesheets arrive with holidays and approved time off already filled in. Fee forecasts, invoices and the staff handbook are in the same system, on the desk and on the phone.</p><p><b>Custom work.</b> I work with the client in real time to develop apps, software, websites, dashboards, marketing and 3D renderings. Each firm gets its own build, made around its projects, its data and its brand. I work in minutes, hours, days and weeks, not months.</p>`)}
